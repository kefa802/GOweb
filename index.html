<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>9路盤 詰碁・検討アプリ</title>
    <script src="https://cdn.jsdelivr.net/gh/waltheri/wgo.js@master/wgo/wgo.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        h2 { font-size: 1.1rem; margin: 5px 0 15px 0; color: #333; }
        #board { width: 100%; max-width: 400px; margin-bottom: 15px; touch-action: manipulation; }
        
        .controls { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); width: 100%; max-width: 380px; margin-bottom: 15px; box-sizing: border-box; }
        .control-group { margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .control-group:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        
        .mode-title { font-weight: bold; font-size: 0.9rem; margin-bottom: 8px; display: block; color: #555; }
        .radio-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 5px; }
        .radio-group label { background: #e9ecef; padding: 12px; border-radius: 4px; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 100%; box-sizing: border-box; gap: 4px; }
        .radio-group input[type="radio"]:checked + span { font-weight: bold; color: #0056b3; }
        .hint { font-size: 0.8rem; color: #666; text-align: center; margin-bottom: 10px; line-height: 1.4; }
        
        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 10px; border: none; border-radius: 4px; background: #007bff; color: white; cursor: pointer; font-size: 0.9rem; font-weight: bold; }
        button:active { background: #0056b3; }
        button.btn-reset { background: #6c757d; }
        button.btn-reset:active { background: #5a6268; }
        
        textarea { width: 100%; height: 60px; box-sizing: border-box; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px; padding: 8px; font-size: 0.8rem; resize: none; }
    </style>
</head>
<body>

    <h2>9路盤 詰碁・検討アプリ</h2>
    
    <div id="board"></div>

    <div class="controls">
        <div class="control-group">
            <span class="mode-title">1. モード選択</span>
            
            <div class="radio-group">
                <label><input type="radio" name="mode" value="setup" checked><span>盤面を自由に配置する</span></label>
            </div>
            <div class="hint">
                👆 空の場所をタップ：黒<br>
                ✌️ ダブルタップ：白<br>
                ❌ すでに石がある場所をタップ：消去
            </div>

            <div class="radio-group" style="margin-top: 10px;">
                <label style="background: #d4edda;">
                    <input type="radio" name="mode" value="play" id="mode-play">
                    <span style="color: #155724; font-size: 1rem;">▶ 検討を開始する（数字あり）</span>
                </label>
            </div>
        </div>

        <div class="control-group btn-group">
            <button id="btn-undo">待った（1手戻る）</button>
            <button id="btn-reset" class="btn-reset">検討をリセット</button>
        </div>

        <div class="control-group">
            <span class="mode-title">詰碁SGF読み込み</span>
            <textarea id="sgf-input" placeholder="他のサイトのSGF（テキスト）をここにペースト"></textarea>
            <button id="btn-load-sgf" style="background: #28a745;">盤面に反映する</button>
        </div>
    </div>

    <script>
        window.onerror = function(msg, url, line) {
            alert("エラーが発生しました: " + msg + "\n(Line: " + line + ")");
        };

        window.onload = function() {
            var boardWidth = window.innerWidth < 420 ? window.innerWidth - 20 : 400;
            if (typeof WGo === "undefined") {
                document.getElementById("board").innerHTML = "<p style='color:red;'>WGo.jsの読み込みに失敗しました。</p>";
                return;
            }

            var board = new WGo.Board(document.getElementById("board"), { width: boardWidth, size: 9 });
            
            var setupStones = Array(9).fill(0).map(() => Array(9).fill(0)); 
            var playMoves = []; 
            var game = new WGo.Game(9);

            // ★修正ポイント: ピクセル座標（xr, yr）を正確に取得して数字を描画する処理
            var customNumberMarker = {
                draw: function(args, board) {
                    var ctx = args.ctx || board.getContext("markup");
                    if (!ctx) return;
                    
                    // 盤面のマス目座標を、画面上のピクセル座標に変換！
                    var xr = board.getX(args.x);
                    var yr = board.getY(args.y);
                    
                    ctx.fillStyle = args.textColor; 
                    ctx.textBaseline = "middle";
                    ctx.textAlign = "center";
                    ctx.font = "bold " + Math.floor(board.stoneRadius * 1.1) + "px sans-serif";
                    ctx.fillText(args.text, xr, yr);
                }
            };

            function rebuildGame() {
                board.removeAllObjects();
                game = new WGo.Game(9);

                // 配置モードの石をエンジンに登録し、見た目も描画
                for (let x = 0; x < 9; x++) {
                    for (let y = 0; y < 9; y++) {
                        if (setupStones[x][y] !== 0) {
                            game.play(x, y, setupStones[x][y]);
                            board.addObject({ x: x, y: y, c: setupStones[x][y] });
                        }
                    }
                }
                
                game.turn = WGo.B;

                // 検討モードの手をエンジンに登録し、見た目も描画
                for (let m of playMoves) {
                    game.play(m.x, m.y, m.c);
                    board.addObject({ x: m.x, y: m.y, c: m.c });
                }

                // 取られた石を消すために、現在のエンジンの状態と一致しない石のオブジェクトを整理する処理
                // （シンプルにするため、一度すべてのオブジェクトを描画し直しではなく上書きベースにしています）
                board.removeAllObjects();
                for (let x = 0; x < 9; x++) {
                    for (let y = 0; y < 9; y++) {
                        let stoneColor = game.getPosition().get(x, y);
                        if (stoneColor !== 0) {
                            board.addObject({ x: x, y: y, c: stoneColor });
                        }
                    }
                }

                // ★修正ポイント: 数字ラベルの再描画処理
                let currentMoveNum = 1;
                for (let m of playMoves) {
                    // その石が取られずに盤面に存在している場合のみ数字を描画
                    if (game.getPosition().get(m.x, m.y) === m.c) {
                        board.addObject({
                            x: m.x, 
                            y: m.y, 
                            type: customNumberMarker, 
                            text: currentMoveNum.toString(), 
                            textColor: m.c === WGo.B ? "white" : "black" // 石の色と反転させる
                        });
                    }
                    currentMoveNum++;
                }
            }

            let lastTapTime = 0;
            let lastTapCoords = { x: -1, y: -1 };

            board.addEventListener("click", function(x, y) {
                if (x < 0 || y < 0 || x >= 9 || y >= 9) return;

                let mode = document.querySelector('input[name="mode"]:checked').value;
                let now = Date.now();
                
                let isDoubleTap = (lastTapCoords.x === x && lastTapCoords.y === y && (now - lastTapTime) < 300);
                
                lastTapTime = now;
                lastTapCoords = { x: x, y: y };

                if (mode === "setup") {
                    if (playMoves.length > 0) {
                        if(!confirm("盤面を再配置すると、現在の検討手順はリセットされます。よろしいですか？")) return;
                        playMoves = [];
                    }
                    
                    if (isDoubleTap) {
                        // ダブルタップ時（前回黒を置いた直後）は白に上書き
                        setupStones[x][y] = WGo.W;
                        lastTapTime = 0; 
                    } else {
                        if (setupStones[x][y] !== 0) {
                            // 既に石があれば消去する
                            setupStones[x][y] = 0;
                            lastTapTime = 0; 
                        } else {
                            // 何もなければ黒を置く
                            setupStones[x][y] = WGo.B;
                        }
                    }
                    rebuildGame();
                    
                } else if (mode === "play") {
                    let tempGame = new WGo.Game(9);
                    for (let cx = 0; cx < 9; cx++) {
                        for (let cy = 0; cy < 9; cy++) {
                            if (setupStones[cx][cy] !== 0) tempGame.play(cx, cy, setupStones[cx][cy]);
                        }
                    }
                    tempGame.turn = WGo.B;
                    for (let m of playMoves) tempGame.play(m.x, m.y, m.c);

                    let currentTurn = tempGame.turn;
                    let result = tempGame.play(x, y, currentTurn);
                    
                    if (typeof result === "number") return; 

                    playMoves.push({ x: x, y: y, c: currentTurn });
                    rebuildGame();
                }
            });

            document.getElementById("btn-undo").addEventListener("click", function() {
                if (playMoves.length > 0) {
                    playMoves.pop();
                    rebuildGame();
                }
            });

            document.getElementById("btn-reset").addEventListener("click", function() {
                playMoves = [];
                rebuildGame();
            });

            document.getElementById("btn-load-sgf").addEventListener("click", function() {
                let sgf = document.getElementById("sgf-input").value;
                if(!sgf) return;
                
                setupStones = Array(9).fill(0).map(() => Array(9).fill(0));
                playMoves = [];

                let parseSGF = function(regex, color) {
                    let match = sgf.match(regex);
                    if(match) {
                        let stones = match[1].match(/\[[a-i]{2}\]/g);
                        if(stones) {
                            stones.forEach(s => {
                                let x = s.charCodeAt(1) - 97;
                                let y = s.charCodeAt(2) - 97;
                                if(x>=0 && x<9 && y>=0 && y<9) setupStones[x][y] = color;
                            });
                        }
                    }
                };
                
                parseSGF(/AB((?:\[[a-i]{2}\])+)/, WGo.B);
                parseSGF(/AW((?:\[[a-i]{2}\])+)/, WGo.W);
                
                rebuildGame();
                document.getElementById("mode-play").checked = true; 
            });

            rebuildGame();
        };
    </script>
</body>
</html>
