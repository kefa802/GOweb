<!DOCTYPE html>

  <!-- Tailwind CSS -->

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');

    body {
      font-family: 'Noto Sans JP', sans-serif;

  </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

  <!-- ヘッダー（レスポンシブ対応: スマホでも文字が重ならないようflex-wrapとgapを使用） -->
  <header class="bg-slate-800 border-b border-slate-700 py-2 px-3 flex flex-wrap items-center justify-between gap-2 shrink-0 z-10 shadow-md">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-full bg-amber-500/20 flex items-center justify-center border border-amber-500 text-amber-400">
        <i data-lucide="circle-dot" class="w-5 h-5"></i>
      </div>
      <div class="flex flex-col">
        <h1 class="text-sm md:text-base font-bold text-slate-100 leading-tight">9路盤 囲碁AI道場</h1>
        <span class="text-[10px] md:text-xs text-amber-300 font-medium">中国ルール・コミ7目</span>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="resetGame()" class="flex items-center gap-1 bg-slate-700 hover:bg-slate-600 text-white text-xs py-1.5 px-3 rounded shadow transition">
        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
        リセット
      </button>
    </div>
  </header>

  <!-- メインコンテンツ（PCでは左右分割、スマホでは縦積み） -->
  <main class="flex-1 flex flex-col md:flex-row w-full max-w-6xl mx-auto overflow-hidden">
    
    <!-- 左側：対局エリア -->
    <section class="flex-1 flex flex-col items-center justify-center p-2 md:p-4 min-h-0 relative">
      
      <!-- ステータスバー（盤上の石数など） -->
      <div class="w-full max-w-sm flex items-center justify-between bg-slate-800 rounded-lg p-2 mb-2 md:mb-4 shadow text-xs md:text-sm border border-slate-700">
        <!-- 黒番（あなた） -->
        <div class="flex items-center gap-1.5">
          <div class="w-4 h-4 rounded-full stone-black-ui border border-slate-600"></div>
          <div class="flex flex-col">
            <span class="font-bold text-slate-200 leading-none">黒 (あなた)</span>
            <span id="score-black" class="text-[10px] text-slate-400 mt-0.5">石+地: 0</span>
          </div>
        </div>
        
        <!-- 手番インジケーター -->
        <div class="text-center font-bold text-amber-400">
          <span id="turn-indicator">黒の手番</span>
          <div id="move-count" class="text-[10px] text-slate-400 font-normal mt-0.5">0手目</div>
        </div>

        <!-- 白番（CPU） -->
        <div class="flex items-center gap-1.5 text-right">
          <div class="flex flex-col items-end">
            <span class="font-bold text-slate-200 leading-none">白 (CPU)</span>
            <span id="score-white" class="text-[10px] text-slate-400 mt-0.5">石+地: 0 (+7目)</span>
          </div>
          <div class="w-4 h-4 rounded-full stone-white-ui border border-slate-400"></div>
        </div>
      </div>

      <!-- 盤面コンテナ（正方形を維持） -->
      <div class="relative w-full max-w-[360px] md:max-w-[480px] aspect-square wood-board p-2 md:p-3">
        <!-- キャンバスで線と石を描画。タッチイベントのズレを防ぐためw-full h-fullを指定 -->
        <canvas id="goban-canvas" class="w-full h-full cursor-pointer block"></canvas>
      </div>

      <!-- コントロールボタン -->
      <div class="w-full max-w-sm flex gap-2 mt-2 md:mt-4">
        <button id="btn-pass" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs md:text-sm py-2 rounded-lg font-bold border border-slate-600 transition flex justify-center items-center gap-1">
          <i data-lucide="step-forward" class="w-4 h-4"></i> パス
        </button>
        <button id="btn-resign" class="flex-1 bg-rose-900/60 hover:bg-rose-800/80 text-rose-200 text-xs md:text-sm py-2 rounded-lg font-bold border border-rose-800 transition flex justify-center items-center gap-1">
          <i data-lucide="flag" class="w-4 h-4"></i> 投了
        </button>
      </div>
    </section>

    <!-- 右側：Gemini指導パネル -->
    <aside class="w-full md:w-80 h-1/3 md:h-full flex flex-col bg-slate-800/80 border-t md:border-t-0 md:border-l border-slate-700 shrink-0">
      
      <!-- 指導ボタンエリア -->
      <div class="p-3 bg-slate-900 border-b border-slate-700 shadow-md z-10">
        <button id="btn-coach" class="w-full bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-slate-950 font-bold py-2.5 rounded-lg shadow-lg flex items-center justify-center gap-2 transition active:scale-95 text-sm md:text-base">
          <i data-lucide="sparkles" class="w-5 h-5"></i>
          いまの手を指導してもらう
        </button>
        <p class="text-[10px] text-slate-400 text-center mt-1.5 leading-tight">
          AIが現在の手に対する評価や改善点をアドバイスします（ダミー動作）
        </p>
      </div>

      <!-- チャット履歴 -->
      <div id="chat-container" class="flex-1 overflow-y-auto p-3 space-y-3 chat-scroll text-sm">
        <div class="bg-slate-700/50 p-3 rounded-lg border border-slate-600 text-slate-300">
          <div class="flex items-center gap-1.5 text-amber-400 font-bold text-xs mb-1">
            <i data-lucide="info" class="w-4 h-4"></i>
            <span>システム</span>
          </div>
          <p class="text-xs leading-relaxed">
            対局を開始しました。あなたは黒番です。<br>
            盤面をタップして石を打ってください。CPU(白)は自動で打ち返します。<br>
            ※中国ルールにより、ダメ詰めも地となります。
          </p>
        </div>
      </div>
    </aside>
  </main>

  <script>
    // アイコン初期化
    lucide.createIcons();

    // 囲碁の定数
    const BOARD_SIZE = 9;
    const EMPTY = 0;
    const BLACK = 1;
    const WHITE = 2;
    const KOMI = 7.0;

    // 囲碁の盤面状態とロジックを管理するクラス
    class GoLogic {
      constructor() {
        this.board = Array(BOARD_SIZE).fill(0).map(() => Array(BOARD_SIZE).fill(EMPTY));
        this.history = []; // コウ判定・履歴用
        this.turn = BLACK;
        this.passes = 0;
        this.moveCount = 0;
      }

      // 盤面の状態を文字列化（コウ判定用）
      getBoardString() {
        return this.board.map(row => row.join('')).join('');
      }

      cloneBoard(board) {
        return board.map(row => [...row]);
      }

      inBounds(x, y) {
        return x >= 0 && x < BOARD_SIZE && y >= 0 && y < BOARD_SIZE;
      }

      getNeighbors(x, y) {
        const neighbors = [];
        if (x > 0) neighbors.push({x: x-1, y});
        if (x < BOARD_SIZE - 1) neighbors.push({x: x+1, y});
        if (y > 0) neighbors.push({x, y: y-1});
        if (y < BOARD_SIZE - 1) neighbors.push({x, y: y+1});
        return neighbors;
      }

      // 指定した石の連なり（グループ）の呼吸点と、構成する石の座標を取得
      getGroupLiberties(startX, startY, boardState) {
        const color = boardState[startY][startX];
        if (color === EMPTY) return { liberties: 0, stones: [] };

        const visited = Array(BOARD_SIZE).fill(0).map(() => Array(BOARD_SIZE).fill(false));
        const stones = [];
        let liberties = 0;

        const queue = [{x: startX, y: startY}];
        visited[startY][startX] = true;

        while (queue.length > 0) {
          const {x, y} = queue.shift();
          stones.push({x, y});

          for (const n of this.getNeighbors(x, y)) {
            if (!visited[n.y][n.x]) {
              if (boardState[n.y][n.x] === EMPTY) {
                liberties++;
                visited[n.y][n.x] = true; // 同じ空点を重複カウントしないようマーク
              } else if (boardState[n.y][n.x] === color) {
                visited[n.y][n.x] = true;
                queue.push(n);
              }
            }
          }
        }
        return { liberties, stones };
      }

      // 着手が合法かチェックし、可能なら実行する
      playMove(x, y, color) {
        if (!this.inBounds(x, y) || this.board[y][x] !== EMPTY) {
          return false; // 枠外か、既に石がある
        }

        // 仮置き
        const newBoard = this.cloneBoard(this.board);
        newBoard[y][x] = color;
        const opponentColor = color === BLACK ? WHITE : BLACK;
        let capturedStones = [];

        // 相手の石が取れるかチェック
        for (const n of this.getNeighbors(x, y)) {
          if (newBoard[n.y][n.x] === opponentColor) {
            const group = this.getGroupLiberties(n.x, n.y, newBoard);
            if (group.liberties === 0) {
              capturedStones = capturedStones.concat(group.stones);
            }
          }
        }

        // 取れる石を盤面から消す
        capturedStones.forEach(stone => {
          newBoard[stone.y][stone.x] = EMPTY;
        });

        // 自分の打った石が自殺手（呼吸点0）になっていないかチェック
        const myGroup = this.getGroupLiberties(x, y, newBoard);
        if (myGroup.liberties === 0) {
          return false; // 自殺手は禁止
        }

        // 同形反復（コウ）のチェック
        const newBoardStr = newBoard.map(row => row.join('')).join('');
        if (this.history.includes(newBoardStr)) {
          return false; // コウ（以前の盤面に戻る手）は禁止
        }

        // 合法手なので状態を更新
        this.board = newBoard;
        this.history.push(newBoardStr);
        this.turn = opponentColor;
        this.passes = 0;
        this.moveCount++;
        
        return true;
      }

      pass(color) {
        this.turn = color === BLACK ? WHITE : BLACK;
        this.passes++;
        this.moveCount++;
        // 履歴に現在の状態をそのまま追加（ターン経過）
        this.history.push(this.getBoardString());
      }
    }

    // --- 描画ロジック ---
    const canvas = document.getElementById('goban-canvas');
    const ctx = canvas.getContext('2d');
    let game = new GoLogic();
    let isGameOver = false;

    // キャンバスのサイズを要素に合わせる
    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      // 高解像度ディスプレイ対応（Retina等できれいに描画）
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      drawBoard();
    }
    window.addEventListener('resize', resizeCanvas);

    // 盤面を描画する関数
    function drawBoard() {
      const w = canvas.width / (window.devicePixelRatio || 1);
      const h = canvas.height / (window.devicePixelRatio || 1);
      
      ctx.clearRect(0, 0, w, h);

      // パディング(余白)を盤面のサイズの5%程度に設定
      const padding = w * 0.06; 
      const playableSize = w - (padding * 2);
      const cellSize = playableSize / (BOARD_SIZE - 1);

      // 罫線の描画
      ctx.strokeStyle = '#4a2f1d';
      ctx.lineWidth = Math.max(1, w * 0.005);
      ctx.beginPath();
      for (let i = 0; i < BOARD_SIZE; i++) {
        // 縦線
        const x = padding + i * cellSize;
        ctx.moveTo(x, padding);
        ctx.lineTo(x, h - padding);
        // 横線
        const y = padding + i * cellSize;
        ctx.moveTo(padding, y);
        ctx.lineTo(w - padding, y);
      }
      ctx.stroke();

      // 星（9路盤の星: 2,2 / 6,2 / 4,4(天元) / 2,6 / 6,6）
      const starPoints = [
        [2, 2], [6, 2], [4, 4], [2, 6], [6, 6]
      ];
      ctx.fillStyle = '#4a2f1d';
      starPoints.forEach(([sx, sy]) => {
        const px = padding + sx * cellSize;
        const py = padding + sy * cellSize;
        ctx.beginPath();
        ctx.arc(px, py, cellSize * 0.12, 0, Math.PI * 2);
        ctx.fill();
      });

      // 石の描画
      for (let y = 0; y < BOARD_SIZE; y++) {
        for (let x = 0; x < BOARD_SIZE; x++) {
          if (game.board[y][x] !== EMPTY) {
            drawStone(x, y, game.board[y][x], padding, cellSize);
          }
        }
      }
    }

    // 石を一つ描画する関数（立体感のあるグラデーション）
    function drawStone(x, y, color, padding, cellSize) {
      const px = padding + x * cellSize;
      const py = padding + y * cellSize;
      const radius = cellSize * 0.46;

      ctx.save();
      // 影
      ctx.beginPath();
      ctx.arc(px + radius * 0.1, py + radius * 0.15, radius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fill();

      // 石本体
      ctx.beginPath();
      ctx.arc(px, py, radius, 0, Math.PI * 2);
      
      const grad = ctx.createRadialGradient(
        px - radius * 0.3, py - radius * 0.3, radius * 0.1,
        px, py, radius
      );

      if (color === BLACK) {
        grad.addColorStop(0, '#52525b');
        grad.addColorStop(1, '#000000');
      } else {
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(1, '#a1a1aa');
      }

      ctx.fillStyle = grad;
      ctx.fill();
      // 黒石の場合だけ薄い縁取りで見やすくする
      if (color === BLACK) {
        ctx.strokeStyle = '#27272a';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      ctx.restore();
    }

    // --- イベントハンドラとUI更新 ---

    function updateUI() {
      document.getElementById('turn-indicator').textContent = 
        game.turn === BLACK ? '黒の手番 (あなた)' : '白の手番 (CPU)';
      document.getElementById('turn-indicator').style.color = 
        game.turn === BLACK ? '#fbbf24' : '#e2e8f0'; // amber-400 / slate-200
      
      document.getElementById('move-count').textContent = `${game.moveCount}手目`;

      // 簡易的な石数カウント（中国ルールを意識した盤面石数の表示）
      let blackStones = 0, whiteStones = 0;
      for (let y = 0; y < BOARD_SIZE; y++) {
        for (let x = 0; x < BOARD_SIZE; x++) {
          if (game.board[y][x] === BLACK) blackStones++;
          if (game.board[y][x] === WHITE) whiteStones++;
        }
      }
      document.getElementById('score-black').textContent = `盤上石: ${blackStones}`;
      document.getElementById('score-white').textContent = `盤上石: ${whiteStones} (+7目)`;
    }

    // キャンバスクリック時の処理
    canvas.addEventListener('click', (e) => {
      if (isGameOver || game.turn !== BLACK) return;

      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      const w = rect.width;
      const h = rect.height;
      const padding = w * 0.06;
      const cellSize = (w - (padding * 2)) / (BOARD_SIZE - 1);

      // クリック位置から最寄りのグリッド交点を計算
      // (クリック位置 - 余白) / セルサイズ で座標を求め、四捨五入
      const gridX = Math.round((clickX - padding) / cellSize);
      const gridY = Math.round((clickY - padding) / cellSize);

      // 判定範囲内（交点からセルサイズの半分以内）かチェック
      const isInsideBoard = gridX >= 0 && gridX < BOARD_SIZE && gridY >= 0 && gridY < BOARD_SIZE;
      
      if (isInsideBoard) {
        const success = game.playMove(gridX, gridY, BLACK);
        if (success) {
          drawBoard();
          updateUI();
          checkGameEnd();
          
          if (!isGameOver) {
            // CPUに手番を渡す
            setTimeout(playComputerMove, 500);
          }
        }
      }
    });

    // 非常に単純なCPU AI（ランダムに合法手を打つ）
    function playComputerMove() {
      if (isGameOver || game.turn !== WHITE) return;

      // 全ての空きマスから合法手を探す
      const validMoves = [];
      for (let y = 0; y < BOARD_SIZE; y++) {
        for (let x = 0; x < BOARD_SIZE; x++) {
          if (game.board[y][x] === EMPTY) {
            // 仮想的に打ってみて合法かテスト
            const cloneGame = new GoLogic();
            cloneGame.board = game.cloneBoard(game.board);
            cloneGame.history = [...game.history];
            if (cloneGame.playMove(x, y, WHITE)) {
              // 自分の眼（周囲4方向すべて白）を埋めるのは避ける簡単なヒューリスティック
              let myNeighbors = 0;
              let edgeCount = 0;
              if (x>0 && game.board[y][x-1] === WHITE) myNeighbors++; else if (x===0) edgeCount++;
              if (x<8 && game.board[y][x+1] === WHITE) myNeighbors++; else if (x===8) edgeCount++;
              if (y>0 && game.board[y-1][x] === WHITE) myNeighbors++; else if (y===0) edgeCount++;
              if (y<8 && game.board[y+1][x] === WHITE) myNeighbors++; else if (y===8) edgeCount++;
              
              if (myNeighbors + edgeCount < 4) {
                 validMoves.push({x, y});
              }
            }
          }
        }
      }

      if (validMoves.length > 0) {
        // ランダムに選ぶ
        const move = validMoves[Math.floor(Math.random() * validMoves.length)];
        game.playMove(move.x, move.y, WHITE);
        addChatMessage('CPU', 'パチッ (白の着手)');
      } else {
        game.pass(WHITE);
        addChatMessage('CPU', '打つ場所がないのでパスします。');
      }

      drawBoard();
      updateUI();
      checkGameEnd();
    }

    // パス・終局処理
    document.getElementById('btn-pass').addEventListener('click', () => {
      if (isGameOver || game.turn !== BLACK) return;
      game.pass(BLACK);
      addChatMessage('あなた', 'パスしました。');
      updateUI();
      checkGameEnd();
      if (!isGameOver) {
        setTimeout(playComputerMove, 500);
      }
    });

    function checkGameEnd() {
      if (game.passes >= 2) {
        isGameOver = true;
        addChatMessage('システム', '連続パスにより終局しました。本来はここで地合い計算を行いますが、本モックではここまでとなります。お疲れ様でした。');
        document.getElementById('turn-indicator').textContent = '終局';
      }
    }

    document.getElementById('btn-resign').addEventListener('click', () => {
      if (isGameOver) return;
      isGameOver = true;
      addChatMessage('あなた', '投了しました。白の中押し勝ちです。');
      document.getElementById('turn-indicator').textContent = '終局';
    });

    function resetGame() {
      game = new GoLogic();
      isGameOver = false;
      document.getElementById('chat-container').innerHTML = ''; // チャットクリア
      addChatMessage('システム', '対局をリセットしました。あなたが黒番です。');
      updateUI();
      drawBoard();
    }

    // --- Gemini指導ダミーUI ---
    const chatContainer = document.getElementById('chat-container');
    
    function addChatMessage(sender, text) {
      const div = document.createElement('div');
      div.className = 'bg-slate-700 p-3 rounded-lg border border-slate-600 text-slate-200 text-xs shadow-sm';
      div.innerHTML = `
        <div class="font-bold text-amber-400 mb-1 flex items-center gap-1">
          <i data-lucide="${sender === 'システム' || sender === 'CPU' ? 'monitor' : sender === 'あなた' ? 'user' : 'sparkles'}" class="w-3.5 h-3.5"></i>
          ${sender}
        </div>
        <p class="leading-relaxed">${text}</p>
      `;
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      lucide.createIcons();
    }

    document.getElementById('btn-coach').addEventListener('click', () => {
      if (game.moveCount === 0) {
         addChatMessage('指導員', 'まだ石が打たれていません。まずは盤面に打ってみましょう。');
         return;
      }
      addChatMessage('Gemini 指導員', '（※ダミー応答）ここは良い手ですね！中国ルールでは生きている石の数と地の合計で競うため、ダメ詰めも重要になります。相手の反撃に注意しながら打ち進めましょう。');
    });

    // 初期化実行
    setTimeout(() => {
      resizeCanvas();
      updateUI();
    }, 100);

  </script>
</body>
