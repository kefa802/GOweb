<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9路盤 検討アプリ</title>
    <script src="https://cdn.jsdelivr.net/gh/waltheri/wgo.js@master/wgo.js"></script>
    <style>
        body { 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin-top: 20px; 
            background-color: #f9f9f9;
        }
        #board { 
            /* スマホでもはみ出さないように最大幅を指定 */
            width: 100%; 
            max-width: 400px; 
            margin-bottom: 20px; 
        }
    </style>
</head>
<body>

    <h2 style="font-size: 1.2rem;">9路盤 検討アプリ</h2>
    
    <div id="board"></div>

    <script>
        // スマホの画面幅に合わせて碁盤のサイズを自動調整
        var boardWidth = window.innerWidth < 420 ? window.innerWidth - 20 : 400;

        // ライブラリが読み込めているかのチェック
        if (typeof WGo === "undefined") {
            document.getElementById("board").innerHTML = "<p style='color:red; font-weight:bold;'>WGo.jsの読み込みに失敗しました。</p>";
        } else {
            var board = new WGo.Board(document.getElementById("board"), {
                width: boardWidth,
                size: 9
            });

            var game = new WGo.Game(9);

            board.addEventListener("click", function(x, y) {
                var result = game.play(x, y);
                if(typeof result == "number") {
                    console.log("そこには打てません。エラーコード:", result);
                } else {
                    board.update(game.getPosition());
                }
            });
        }
    </script>

</body>
</html>
